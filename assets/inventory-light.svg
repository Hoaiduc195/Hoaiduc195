  <text x="48" y="69" class="cat" fill="#237a6f">LANGUAGES</text>
  <text x="48" y="107" class="cat" fill="#2d6a8a">AI &amp; DATA</text>
  <text x="48" y="145" class="cat" fill="#a85d1e">WEB &amp; APIS</text>
  <text x="48" y="183" class="cat" fill="#b8323e">DB &amp; TOOLS</text>

