      <rect x="328" y="130" width="4" height="24" />
      <rect x="394" y="130" width="4" height="24" />
      <rect x="490" y="130" width="4" height="24" />
      <rect x="580" y="130" width="4" height="24" />
      <rect x="664" y="130" width="4" height="24" />
      <rect x="754" y="130" width="4" height="24" />
