    <rect x="8" y="8" width="944" height="204" fill="#fbf8f1" />

    <!-- Outer Pixel Frame -->
    <rect x="8" y="0" width="944" height="8" fill="#3a3d4e" />
    <rect x="8" y="212" width="944" height="8" fill="#3a3d4e" />
    <rect x="0" y="8" width="8" height="204" fill="#3a3d4e" />
    <rect x="952" y="8" width="8" height="204" fill="#3a3d4e" />
    <rect x="8" y="8" width="8" height="8" fill="#c97b36" />
    <rect x="944" y="8" width="8" height="8" fill="#c97b36" />
    <rect x="8" y="204" width="8" height="8" fill="#c97b36" />
    <rect x="944" y="204" width="8" height="8" fill="#c97b36" />

    <!-- Category Bullet Pixels -->
    <rect x="32" y="61" width="8" height="8" fill="#2a9d8f" />
    <rect x="32" y="99" width="8" height="8" fill="#3b82a6" />
    <rect x="32" y="137" width="8" height="8" fill="#c97b36" />
    <rect x="32" y="175" width="8" height="8" fill="#d64550" />

    <!-- Row 1 Slots: LANGUAGES -->
    <g fill="#f2eadb" stroke="#cbbda4" stroke-width="2">
