  <text x="359" y="146" text-anchor="middle" class="item">Vite</text>
  <text x="440" y="146" text-anchor="middle" class="item">Tailwind</text>
  <text x="533" y="146" text-anchor="middle" class="item">FastAPI</text>
  <text x="620" y="146" text-anchor="middle" class="item">NestJS</text>
  <text x="707" y="146" text-anchor="middle" class="item">Fastify</text>
  <text x="797" y="146" text-anchor="middle" class="item">Express</text>
