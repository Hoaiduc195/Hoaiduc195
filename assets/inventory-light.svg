      <rect x="212" y="54" width="4" height="24" />
      <rect x="274" y="54" width="4" height="24" />
      <rect x="360" y="54" width="4" height="24" />
      <rect x="476" y="54" width="4" height="24" />
      <rect x="592" y="54" width="4" height="24" />
