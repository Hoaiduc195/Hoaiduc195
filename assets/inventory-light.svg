<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%" role="img" aria-label="Tech Inventory — Light">
  <style>
    .hdr {
      font-family: 'Cascadia Mono', 'JetBrains Mono', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #b5651d;
    }
    .cat {
      font-family: 'Cascadia Mono', 'JetBrains Mono', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .item {
      font-family: 'Cascadia Mono', 'JetBrains Mono', 'Courier New', monospace;
      font-size: 11.5px;
      font-weight: 700;
      fill: #232635;
    }
  </style>

  <g shape-rendering="crispEdges">
