<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="100%" height="100%" role="img" aria-label="Hoai Duc Duong Footer Wave">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#090d1f" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.28" />
    </linearGradient>

    <linearGradient id="fBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>

    <clipPath id="fClip">
      <rect x="2" y="2" width="996" height="126" rx="16" />
    </clipPath>
  </defs>

  <style>
    .f-main {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      letter-spacing: 2.5px;
      fill: #e2e8f0;
      font-weight: 600;
    }
    .f-sub {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 1.6px;
      fill: #94a3b8;
    }
    @keyframes waveShift1 {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-60px); }
    }
    @keyframes waveShift2 {
      0%, 100% { transform: translateX(-50px); }
      50% { transform: translateX(20px); }
    }
    .w1 { animation: waveShift1 7s ease-in-out infinite; }
    .w2 { animation: waveShift2 9s ease-in-out infinite; }
  </style>

  <g clip-path="url(#fClip)">
    <rect width="1000" height="130" fill="url(#fBg)" />

    <path class="w1" d="M -100 80 Q 100 40 300 78 T 700 78 T 1100 78 L 1100 140 L -100 140 Z" fill="url(#wave1)" />
    <path class="w2" d="M -100 92 Q 150 120 400 84 T 900 84 T 1200 84 L 1200 140 L -100 140 Z" fill="url(#wave2)" />

    <text x="500" y="54" text-anchor="middle" class="f-main">THANKS FOR STOPPING BY</text>
    <text x="500" y="78" text-anchor="middle" class="f-sub">OPEN TO RESEARCH, COLLABORATION &amp; INTERESTING CONVERSATIONS</text>
  </g>

  <rect x="2" y="2" width="996" height="126" rx="16" fill="none" stroke="url(#fBorder)" stroke-width="1.4" />
</svg>
