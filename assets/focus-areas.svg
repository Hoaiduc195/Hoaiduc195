<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 215" width="100%" height="100%" role="img" aria-label="Areas I Explore">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#070b17" />
    </linearGradient>

    <radialGradient id="glowTeal" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRose" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .sec-title {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 12px;
      letter-spacing: 3px;
      fill: #94a3b8;
      font-weight: 600;
    }
    .card-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .card-sub {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 10.2px;
      fill: #94a3b8;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
    .halo1 { animation: breathe 3.4s ease-in-out infinite; }
    .halo2 { animation: breathe 3.4s ease-in-out infinite 0.5s; }
    .halo3 { animation: breathe 3.4s ease-in-out infinite 1.0s; }
    .halo4 { animation: breathe 3.4s ease-in-out infinite 1.5s; }
    .halo5 { animation: breathe 3.4s ease-in-out infinite 2.0s; }
  </style>

  <text x="500" y="18" text-anchor="middle" class="sec-title">// RESEARCH &amp; EXPLORATION DOMAINS</text>

  <!-- Card 1: GenAI & LLMs -->
  <g transform="translate(10, 34)">
    <rect width="184" height="172" rx="14" fill="url(#cardBg)" stroke="#14b8a6" stroke-opacity="0.45" stroke-width="1.2" />
    <rect width="184" height="172" rx="14" fill="url(#glowTeal)" class="halo1" />
    <rect x="42" y="0" width="100" height="2.5" rx="1.2" fill="#2dd4bf" filter="url(#iconGlow)" />
    <!-- Spark / LLM Icon -->
    <g transform="translate(92, 56)" filter="url(#iconGlow)">
      <circle r="24" fill="#14b8a6" fill-opacity="0.14" stroke="#2dd4bf" stroke-width="1.2" />
      <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="#5eead4" />
    </g>
    <text x="92" y="114" text-anchor="middle" class="card-title">GenAI &amp; LLMs</text>
    <text x="92" y="136" text-anchor="middle" class="card-sub">Agents · Reasoning</text>
    <text x="92" y="153" text-anchor="middle" class="card-sub">Multimodal Systems</text>
  </g>

  <!-- Card 2: ML & RL -->
  <g transform="translate(209, 34)">
    <rect width="184" height="172" rx="14" fill="url(#cardBg)" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="1.2" />
    <rect width="184" height="172" rx="14" fill="url(#glowCyan)" class="halo2" />
    <rect x="42" y="0" width="100" height="2.5" rx="1.2" fill="#22d3ee" filter="url(#iconGlow)" />
    <!-- Neural Network Icon -->
    <g transform="translate(92, 56)" filter="url(#iconGlow)">
      <circle r="24" fill="#06b6d4" fill-opacity="0.14" stroke="#22d3ee" stroke-width="1.2" />
      <line x1="-10" y1="-7" x2="10" y2="0" stroke="#67e8f9" stroke-width="1.4" />
      <line x1="-10" y1="7" x2="10" y2="0" stroke="#67e8f9" stroke-width="1.4" />
      <line x1="-10" y1="-7" x2="-10" y2="7" stroke="#67e8f9" stroke-width="1.2" />
      <circle cx="-10" cy="-7" r="3.5" fill="#67e8f9" />
      <circle cx="-10" cy="7" r="3.5" fill="#67e8f9" />
      <circle cx="10" cy="0" r="4" fill="#22d3ee" />
    </g>
    <text x="92" y="114" text-anchor="middle" class="card-title">ML &amp; RL</text>
    <text x="92" y="136" text-anchor="middle" class="card-sub">Deep Learning</text>
    <text x="92" y="153" text-anchor="middle" class="card-sub">Policy Optimization</text>
  </g>

  <!-- Card 3: Computer Vision -->
  <g transform="translate(408, 34)">
    <rect width="184" height="172" rx="14" fill="url(#cardBg)" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.2" />
    <rect width="184" height="172" rx="14" fill="url(#glowBlue)" class="halo3" />
    <rect x="42" y="0" width="100" height="2.5" rx="1.2" fill="#60a5fa" filter="url(#iconGlow)" />
    <!-- Vision Eye / Lens Icon -->
    <g transform="translate(92, 56)" filter="url(#iconGlow)">
      <circle r="24" fill="#3b82f6" fill-opacity="0.14" stroke="#60a5fa" stroke-width="1.2" />
      <path d="M -13 0 Q 0 -11 13 0 Q 0 11 -13 0 Z" fill="none" stroke="#93c5fd" stroke-width="1.8" />
      <circle cx="0" cy="0" r="4.2" fill="#60a5fa" />
    </g>
    <text x="92" y="114" text-anchor="middle" class="card-title">Computer Vision</text>
    <text x="92" y="136" text-anchor="middle" class="card-sub">Visual Understanding</text>
    <text x="92" y="153" text-anchor="middle" class="card-sub">Perception &amp; Video</text>
  </g>

  <!-- Card 4: Security -->
  <g transform="translate(607, 34)">
    <rect width="184" height="172" rx="14" fill="url(#cardBg)" stroke="#f43f5e" stroke-opacity="0.45" stroke-width="1.2" />
    <rect width="184" height="172" rx="14" fill="url(#glowRose)" class="halo4" />
    <rect x="42" y="0" width="100" height="2.5" rx="1.2" fill="#fb7185" filter="url(#iconGlow)" />
    <!-- Shield Icon -->
    <g transform="translate(92, 56)" filter="url(#iconGlow)">
      <circle r="24" fill="#f43f5e" fill-opacity="0.14" stroke="#fb7185" stroke-width="1.2" />
      <path d="M 0 -12 L 10 -7 L 10 2 C 10 8 5 12 0 14 C -5 12 -10 8 -10 2 L -10 -7 Z" fill="none" stroke="#fda4af" stroke-width="1.8" />
      <circle cx="0" cy="1" r="2.8" fill="#fb7185" />
    </g>
    <text x="92" y="114" text-anchor="middle" class="card-title">Security</text>
    <text x="92" y="136" text-anchor="middle" class="card-sub">Secure Computing</text>
    <text x="92" y="153" text-anchor="middle" class="card-sub">Systems &amp; Defense</text>
  </g>

  <!-- Card 5: Competitive Programming -->
  <g transform="translate(806, 34)">
    <rect width="184" height="172" rx="14" fill="url(#cardBg)" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.2" />
    <rect width="184" height="172" rx="14" fill="url(#glowViolet)" class="halo5" />
    <rect x="42" y="0" width="100" height="2.5" rx="1.2" fill="#c084fc" filter="url(#iconGlow)" />
    <!-- Code / Algorithm Brackets Icon -->
    <g transform="translate(92, 56)" filter="url(#iconGlow)">
      <circle r="24" fill="#a855f7" fill-opacity="0.14" stroke="#c084fc" stroke-width="1.2" />
      <path d="M -6 -8 L -13 0 L -6 8 M 6 -8 L 13 0 L 6 8 M 2 -10 L -2 10" fill="none" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="92" y="114" text-anchor="middle" class="card-title">Algorithms &amp; CP</text>
    <text x="92" y="136" text-anchor="middle" class="card-sub">Problem Solving</text>
    <text x="92" y="153" text-anchor="middle" class="card-sub">Data Structures</text>
  </g>
</svg>
