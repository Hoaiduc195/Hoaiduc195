<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="100%" height="100%" role="img" aria-label="Neon section divider">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="25%" stop-color="#14b8a6" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePrism {
      0%, 100% { opacity: 0.7; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    @keyframes travelRight {
      0% { transform: translateX(-460px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(460px); opacity: 0; }
    }
    .prism { animation: pulsePrism 2.6s ease-in-out infinite; transform-origin: 500px 14px; }
    .spark { animation: travelRight 4.2s linear infinite; }
  </style>

  <line x1="20" y1="14" x2="980" y2="14" stroke="url(#divLine)" stroke-width="1.5" />
  <rect class="spark" x="480" y="12.5" width="40" height="3" rx="1.5" fill="#5eead4" filter="url(#divGlow)" />

  <g class="prism" filter="url(#divGlow)">
    <polygon points="500,6 510,14 500,22 490,14" fill="#090d1f" stroke="#5eead4" stroke-width="1.6" />
    <circle cx="500" cy="14" r="2.2" fill="#c084fc" />
  </g>
</svg>
