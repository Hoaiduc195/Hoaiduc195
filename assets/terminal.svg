<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 285" width="100%" height="100%" role="img" aria-label="Hoai Duc Duong Terminal Profile">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b17" />
      <stop offset="100%" stop-color="#0d1326" />
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .code {
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 13.5px;
    }
    .header-txt {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 11.5px;
      fill: #94a3b8;
      letter-spacing: 0.8px;
    }
    .radar-label {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 10px;
      fill: #64748b;
      letter-spacing: 1.4px;
    }
    .kw { fill: #c084fc; font-weight: 600; }
    .var { fill: #38bdf8; }
    .prop { fill: #5eead4; }
    .str { fill: #fde68a; }
    .punc { fill: #64748b; }
    .cmt { fill: #475569; font-style: italic; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes spinRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.7); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    @keyframes barWave {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }

    .cursor { animation: blink 1.1s step-end infinite; }
    .radar-sweep { animation: spinRadar 5s linear infinite; transform-origin: 855px 152px; }
    .pulse-ring { animation: pulseRing 2.6s ease-out infinite; transform-origin: 855px 152px; }
    .eq1 { animation: barWave 1.4s ease-in-out infinite; transform-origin: 805px 250px; }
    .eq2 { animation: barWave 1.1s ease-in-out infinite 0.2s; transform-origin: 820px 250px; }
    .eq3 { animation: barWave 1.6s ease-in-out infinite 0.4s; transform-origin: 835px 250px; }
    .eq4 { animation: barWave 1.2s ease-in-out infinite 0.1s; transform-origin: 850px 250px; }
    .eq5 { animation: barWave 1.5s ease-in-out infinite 0.3s; transform-origin: 865px 250px; }
    .eq6 { animation: barWave 1.3s ease-in-out infinite 0.5s; transform-origin: 880px 250px; }
    .eq7 { animation: barWave 1.7s ease-in-out infinite 0.15s; transform-origin: 895px 250px; }
  </style>

  <!-- Main Card -->
  <rect x="2" y="2" width="996" height="281" rx="16" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Top Bar -->
  <path d="M 2 18 Q 2 2 18 2 L 982 2 Q 998 2 998 18 L 998 40 L 2 40 Z" fill="#0f172a" fill-opacity="0.9" />
  <line x1="2" y1="40" x2="998" y2="40" stroke="#1e293b" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="24" cy="21" r="5.5" fill="#fb7185" />
  <circle cx="43" cy="21" r="5.5" fill="#fbbf24" />
  <circle cx="62" cy="21" r="5.5" fill="#34d399" />

  <text x="500" y="25" text-anchor="middle" class="header-txt">hoaiduc195@hcmus: ~/whoami.ts</text>
  <text x="976" y="25" text-anchor="end" class="header-txt" fill="#2dd4bf">TS 5.x</text>

  <!-- Code Column -->
  <g class="code">
    <text x="28" y="72"><tspan class="cmt">// Exploring the intersection of intelligence, vision, security &amp; algorithms</tspan></text>
    <text x="28" y="100"><tspan class="kw">const</tspan> <tspan class="var">profile</tspan> <tspan class="punc">=</tspan> <tspan class="punc">{</tspan></text>
    <text x="48" y="126"><tspan class="prop">name</tspan><tspan class="punc">:</tspan>        <tspan class="str">"Hoai Duc Duong"</tspan><tspan class="punc">,</tspan></text>
    <text x="48" y="152"><tspan class="prop">university</tspan><tspan class="punc">:</tspan>  <tspan class="str">"HCMUS — Computer Science"</tspan><tspan class="punc">,</tspan></text>
    <text x="48" y="178"><tspan class="prop">domains</tspan><tspan class="punc">:</tspan>     <tspan class="punc">[</tspan><tspan class="str">"GenAI &amp; LLMs"</tspan><tspan class="punc">,</tspan> <tspan class="str">"ML &amp; RL"</tspan><tspan class="punc">,</tspan> <tspan class="str">"CV"</tspan><tspan class="punc">,</tspan> <tspan class="str">"Security"</tspan><tspan class="punc">,</tspan> <tspan class="str">"CP"</tspan><tspan class="punc">],</tspan></text>
    <text x="48" y="204"><tspan class="prop">approach</tspan><tspan class="punc">:</tspan>    <tspan class="str">"First-principles thinking + clean engineering"</tspan><tspan class="punc">,</tspan></text>
    <text x="48" y="230"><tspan class="prop">status</tspan><tspan class="punc">:</tspan>      <tspan class="str">"Always learning, building &amp; pushing boundaries"</tspan></text>
    <text x="28" y="256"><tspan class="punc">};</tspan> <tspan class="cursor" fill="#2dd4bf">▋</tspan></text>
  </g>

  <!-- Vertical Divider -->
  <line x1="730" y1="58" x2="730" y2="264" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Right Side Holographic Neural Radar -->
  <g>
    <circle cx="855" cy="152" r="68" fill="url(#radarGlow)" />
    <circle cx="855" cy="152" r="62" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle cx="855" cy="152" r="42" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4" />
    <circle cx="855" cy="152" r="22" fill="none" stroke="#334155" stroke-width="1" />
    <line x1="785" y1="152" x2="925" y2="152" stroke="#1e293b" stroke-width="1" />
    <line x1="855" y1="82" x2="855" y2="222" stroke="#1e293b" stroke-width="1" />

    <!-- Expanding Pulse -->
    <circle class="pulse-ring" cx="855" cy="152" r="44" fill="none" stroke="#22d3ee" stroke-width="1.4" />

    <!-- Radar Sweep Wedge -->
    <g class="radar-sweep">
      <path d="M 855 152 L 855 90 A 62 62 0 0 1 908 121 Z" fill="#22d3ee" fill-opacity="0.18" />
      <line x1="855" y1="152" x2="855" y2="90" stroke="#5eead4" stroke-width="1.8" filter="url(#neonGlow)" />
    </g>

    <!-- Radar Blips -->
    <circle cx="882" cy="126" r="3.5" fill="#5eead4" filter="url(#neonGlow)" />
    <circle cx="826" cy="172" r="3" fill="#c084fc" filter="url(#neonGlow)" />
    <circle cx="878" cy="176" r="2.8" fill="#38bdf8" />
    <circle cx="855" cy="152" r="4" fill="#22d3ee" filter="url(#neonGlow)" />

    <!-- Mini Telemetry Equalizer -->
    <g fill="url(#waveGrad)">
      <rect class="eq1" x="802" y="232" width="6" height="22" rx="3" />
      <rect class="eq2" x="817" y="232" width="6" height="22" rx="3" />
      <rect class="eq3" x="832" y="232" width="6" height="22" rx="3" />
      <rect class="eq4" x="847" y="232" width="6" height="22" rx="3" />
      <rect class="eq5" x="862" y="232" width="6" height="22" rx="3" />
      <rect class="eq6" x="877" y="232" width="6" height="22" rx="3" />
      <rect class="eq7" x="892" y="232" width="6" height="22" rx="3" />
    </g>

    <text x="855" y="74" text-anchor="middle" class="radar-label">NEURAL TELEMETRY</text>
    <text x="855" y="268" text-anchor="middle" class="radar-label" fill="#2dd4bf">SIGNAL: ACTIVE</text>
  </g>
</svg>
