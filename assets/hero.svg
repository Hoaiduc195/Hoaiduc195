<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%" role="img" aria-label="Hoai Duc Duong — Computer Science at HCMUS">
  <defs>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="998" height="248" rx="12" ry="12" />
    </clipPath>

    <radialGradient id="subtleLight" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.045" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#30363d" fill-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .eyebrow {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      font-size: 11px;
      letter-spacing: 2.5px;
      fill: #8b949e;
      font-weight: 500;
    }
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.8px;
      fill: #f0f6fc;
    }
    .role {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      font-size: 13.5px;
      fill: #8b949e;
    }
    .bio {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      fill: #c9d1d9;
    }

    @keyframes rot1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rot2 {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .ring-a { animation: rot1 32s linear infinite; transform-origin: 815px 125px; }
    .ring-b { animation: rot2 24s linear infinite; transform-origin: 815px 125px; }
    .ring-c { animation: rot1 18s linear infinite; transform-origin: 815px 125px; }
    .cursor { animation: blink 1.2s step-end infinite; }
  </style>

  <g clip-path="url(#frameClip)">
    <!-- Seamless GitHub Dark Canvas -->
    <rect width="1000" height="250" fill="#0d1117" />
    <rect width="1000" height="250" fill="url(#dotMatrix)" />
    <rect width="1000" height="250" fill="url(#subtleLight)" />

    <!-- Minimalist Editorial Text -->
    <text x="56" y="64" class="eyebrow">HOAIDUC195</text>
    <text x="56" y="116" class="name">Hoai Duc Duong</text>
    <text x="56" y="148" class="role">Computer Science @ HCMUS<tspan class="cursor" fill="#e6edf3">_</tspan></text>

    <line x1="56" y1="172" x2="108" y2="172" stroke="#30363d" stroke-width="1.5" />
    <text x="56" y="200" class="bio">Exploring intelligent systems, computer vision, security, and algorithms.</text>

    <!-- Minimalist Kinetic Geometric Sculpture -->
    <g fill="none">
      <!-- Outer faint reference circle -->
      <circle cx="815" cy="125" r="92" stroke="#21262d" stroke-width="1" />
      <circle cx="815" cy="125" r="64" stroke="#21262d" stroke-width="1" stroke-dasharray="2 5" />

      <!-- Rotating Wireframe Ellipses -->
      <g class="ring-a">
        <ellipse cx="815" cy="125" rx="92" ry="34" stroke="#484f58" stroke-width="1.1" />
        <ellipse cx="815" cy="125" rx="34" ry="92" stroke="#30363d" stroke-width="1" />
        <circle cx="907" cy="125" r="2.8" fill="#e6edf3" />
      </g>

      <g class="ring-b">
        <ellipse cx="815" cy="125" rx="76" ry="26" transform="rotate(35 815 125)" stroke="#6e7681" stroke-width="1" />
        <circle cx="753" cy="81" r="2.2" fill="#8b949e" />
      </g>

      <g class="ring-c">
        <ellipse cx="815" cy="125" rx="54" ry="18" transform="rotate(-40 815 125)" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" />
        <circle cx="856" cy="90" r="2" fill="#f0f6fc" />
      </g>

      <!-- Center Node -->
      <circle cx="815" cy="125" r="3" fill="#f0f6fc" />
    </g>
  </g>

  <!-- Crisp Hairline Border -->
  <rect x="1" y="1" width="998" height="248" rx="12" ry="12" fill="none" stroke="#21262d" stroke-width="1.2" />
</svg>
