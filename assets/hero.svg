<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="100%" height="100%" role="img" aria-label="Hoai Duc Duong — Computer Science at HCMUS">
  <defs>
    <linearGradient id="bgSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1015" />
      <stop offset="55%" stop-color="#13161e" />
      <stop offset="100%" stop-color="#0e1015" />
    </linearGradient>

    <radialGradient id="warmGalleryLight" cx="82%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#d4af7a" stop-opacity="0.11" />
      <stop offset="55%" stop-color="#c8a46b" stop-opacity="0.035" />
      <stop offset="100%" stop-color="#0e1015" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af7a" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#c8a46b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c8a46b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="arcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c896" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#c8a46b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.45" />
    </linearGradient>

    <clipPath id="heroClip">
      <rect x="1" y="1" width="998" height="288" rx="14" ry="14" />
    </clipPath>
  </defs>

  <style>
    .eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 10.5px;
      letter-spacing: 3px;
      fill: #c8a46b;
      font-weight: 600;
    }
    .serif-name {
      font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 0.4px;
      fill: #f5f2eb;
    }
    .subtitle {
      font-family: Georgia, 'Palatino Linotype', serif;
      font-style: italic;
      font-size: 16px;
      fill: #b8b5ad;
    }
    .bio {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 13.5px;
      fill: #9ca3af;
      letter-spacing: 0.2px;
    }
    .meta {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 1.5px;
      fill: #6b7280;
    }

    @keyframes slowOrbitCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes slowOrbitCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes gentleBreathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }

    .orbit-1 { animation: slowOrbitCW 48s linear infinite; transform-origin: 805px 145px; }
    .orbit-2 { animation: slowOrbitCCW 36s linear infinite; transform-origin: 805px 145px; }
    .orbit-3 { animation: slowOrbitCW 64s linear infinite; transform-origin: 805px 145px; }
    .star-glow { animation: gentleBreathe 4.5s ease-in-out infinite; }
  </style>

  <g clip-path="url(#heroClip)">
    <!-- Canvas -->
    <rect width="1000" height="290" fill="url(#bgSlate)" />
    <rect width="1000" height="290" fill="url(#warmGalleryLight)" />

    <!-- Subtle Architectural Inner Hairline -->
    <rect x="14" y="14" width="972" height="262" rx="10" fill="none" stroke="#222630" stroke-width="0.9" />

    <!-- Fine Corner Flourishes -->
    <g stroke="#c8a46b" stroke-opacity="0.55" stroke-width="1.2" fill="none">
      <path d="M 14 34 L 14 14 L 34 14" />
      <path d="M 966 14 L 986 14 L 986 34" />
      <path d="M 14 256 L 14 276 L 34 276" />
      <path d="M 966 276 L 986 276 L 986 256" />
    </g>

    <!-- Left Editorial Content -->
    <g transform="translate(58, 0)">
      <line x1="0" y1="68" x2="26" y2="68" stroke="#c8a46b" stroke-width="1.4" />
      <text x="36" y="72" class="eyebrow">COMPUTER SCIENCE · HCMUS</text>

      <text x="0" y="132" class="serif-name">Hoai Duc Duong</text>
      <text x="2" y="164" class="subtitle">Intelligent Systems, Visual Understanding &amp; Secure Computing</text>

      <line x1="0" y1="188" x2="360" y2="188" stroke="url(#goldLine)" stroke-width="1" />

      <text x="0" y="216" class="bio">Student and engineer exploring machine intelligence, computer vision,</text>
      <text x="0" y="236" class="bio">systems security, and algorithmic problem solving.</text>
    </g>

    <!-- Right Astrolabe / Golden-Ratio Architectural Sculpture -->
    <g fill="none">
      <!-- Subtle coordinate crosshairs -->
      <line x1="695" y1="145" x2="915" y2="145" stroke="#262a35" stroke-width="0.8" />
      <line x1="805" y1="35" x2="805" y2="255" stroke="#262a35" stroke-width="0.8" />

      <!-- Outer graduated dial -->
      <circle cx="805" cy="145" r="102" stroke="#262a35" stroke-width="1" />
      <circle cx="805" cy="145" r="96" stroke="#c8a46b" stroke-opacity="0.22" stroke-width="0.8" stroke-dasharray="2 8" />

      <!-- Rotating Elliptical Arcs -->
      <g class="orbit-1">
        <ellipse cx="805" cy="145" rx="96" ry="38" stroke="url(#arcGold)" stroke-width="1.2" />
        <circle cx="901" cy="145" r="3" fill="#e5c896" />
      </g>

      <g class="orbit-2">
        <ellipse cx="805" cy="145" rx="82" ry="32" transform="rotate(52 805 145)" stroke="#6b7280" stroke-opacity="0.45" stroke-width="1" />
        <circle cx="755" cy="80" r="2.2" fill="#f5f2eb" />
      </g>

      <g class="orbit-3">
        <ellipse cx="805" cy="145" rx="64" ry="26" transform="rotate(-48 805 145)" stroke="#c8a46b" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="6 5" />
        <circle cx="848" cy="193" r="2.4" fill="#d4af7a" />
      </g>

      <!-- Inner compass diamond & core -->
      <circle cx="805" cy="145" r="24" stroke="#323746" stroke-width="0.9" />
      <polygon class="star-glow" points="805,137 813,145 805,153 797,145" fill="none" stroke="#d4af7a" stroke-width="1.2" />
      <circle cx="805" cy="145" r="2.5" fill="#f5f2eb" />
    </g>

    <!-- Quiet Metadata Footer -->
    <text x="954" y="260" text-anchor="end" class="meta">@Hoaiduc195</text>
  </g>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="998" height="288" rx="14" ry="14" fill="none" stroke="#262932" stroke-width="1.2" />
</svg>
